name: Project C Server CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  BuildAndTest:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux HTTPS dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install Windows HTTPS dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install 'curl[schannel]:x64-windows'
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S ProjectC.Server -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          cmake -S ProjectC.Server -B build "-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core, sessions and real WebSocket
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Test Unity transport source with four real C# clients
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            server="$GITHUB_WORKSPACE/build/Debug/ProjectCNetworkServer.exe"
          else
            server="$GITHUB_WORKSPACE/build/ProjectCNetworkServer"
          fi
          dotnet run --project ProjectC.Client/Tests/ClientTransportIntegration.csproj -- "$server"
  DockerBuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Docker image
        run: docker build -f ProjectC.Server/Dockerfile -t projectc-server:ci .
      - name: Verify container stays alive and stops gracefully
        run: |
          docker run -d --name projectc -p 127.0.0.1:7777:7777 projectc-server:ci
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' projectc)" = true
          python3 ProjectC.Server/Tests/ContainerLifecycle.py 7777 projectc
